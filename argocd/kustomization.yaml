apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomize

resources:
  - v3.5.4
  - base

patches:
  - path: base/argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: base/argocd-rbac-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
