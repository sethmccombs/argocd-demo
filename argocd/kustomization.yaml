apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomize

# The vendored upstream install.yaml only sets metadata.namespace on a handful
# of resources, so pin the namespace here for all namespaced objects.
namespace: argocd

resources:
  - v3.5.4
  - base

patches:
  - path: base/argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: base/argocd-rbac-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
  - path: base/argocd-server-svc-patch.yaml
    target:
      kind: Service
      name: argocd-server
  # argocd-secret holds the out-of-band Dex GitHub client secret, so it must
  # not be managed by this Application (its sync was stripping the key).
  # Bootstrap creates it per argocd-demo/README.md. prune is off on the
  # argocd Application, so removing it from git does not delete the live object.
  - target:
      kind: Secret
      name: argocd-secret
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-secret
