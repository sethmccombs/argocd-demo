apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-grafana-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: argocd
data:
  argocd-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "title": "Argo CD",
      "uid": "argocd-demo",
      "schemaVersion": 39,
      "version": 1,
      "tags": ["argocd"],
      "time": { "from": "now-6h", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        {
          "type": "stat",
          "title": "Managed Applications",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "count(argocd_app_info)", "refId": "A", "instant": true }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "stat",
          "title": "OutOfSync",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "expr": "sum(argocd_app_info{sync_status=\"OutOfSync\"})", "refId": "A", "instant": true }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        },
        {
          "type": "stat",
          "title": "Degraded",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum(argocd_app_info{health_status=\"Degraded\"})", "refId": "A", "instant": true }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        },
        {
          "type": "stat",
          "title": "Targets Up",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [
            { "expr": "sum(up{job=~\"argocd.*\"}) / count(up{job=~\"argocd.*\"})", "refId": "A", "instant": true }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "percentunit", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] }
        },
        {
          "type": "timeseries",
          "title": "Sync Status",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "sum by (sync_status) (argocd_app_info)", "refId": "A", "legendFormat": "{{sync_status}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Health Status",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "sum by (health_status) (argocd_app_info)", "refId": "A", "legendFormat": "{{health_status}}" }
          ]
        }
      ]
    }
