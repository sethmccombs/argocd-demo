# Values for kube-prometheus-stack (chart 91.9.0)
# Deployed by the `prometheus` Application in namespace `monitoring`.

fullnameOverride: ""

prometheusOperator:
  # The operator's admission webhooks rely on Helm cert-generation hooks that
  # do not reconcile cleanly under Argo CD (the Sync hangs on the hook
  # resources). Not needed for this demo.
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  # With the admission webhooks disabled there is no cert-generation hook to
  # produce the operator's TLS serving secret, yet the operator still mounts it
  # and fails to start. Disable the operator's TLS web server instead.
  tls:
    enabled: false
  # Relax the aggressive 1s probe timeouts so a slow/constrained node does not
  # crash-loop the operator via liveness/readiness failures.
  livenessProbe:
    enabled: true
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    enabled: true
    timeoutSeconds: 5
    failureThreshold: 5

prometheus:
  prometheusSpec:
    retention: 6h
    # Select ServiceMonitors/PrometheusRules from every namespace so the
    # Argo CD monitors (which carry the `release: prometheus` label) are picked
    # up without relying on Helm release label conventions.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

# Optional components trimmed for a lean local demo; the stack is core
# Prometheus + operator + Grafana focused on Argo CD.
alertmanager:
  enabled: false
# Legacy enable-condition keys for the bundled sub-charts.
nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false

# Control-plane component scraping (etcd/scheduler/controller-manager/proxy/
# coredns) deploys Services into kube-system and does not work on a local
# single-node Docker Desktop cluster. Disable it so the AppProject does not
# need access to kube-system.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false

grafana:

  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth:
      disable_login_form: true
  enabled: true
  # Exposed on the desktop's NodePort 32443 (KIND extraPortMappings), then
  # published on the tailnet with `tailscale serve` on port 9443.
  service:
    type: NodePort
    nodePort: 32443
  # Only the Argo CD dashboard we ship; skip ~25 stock dashboards to keep the
  # Grafana SQLite backend light on startup.
  defaultDashboardsEnabled: false
  # The Grafana sidecar loads any ConfigMap labelled `grafana_dashboard`.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
