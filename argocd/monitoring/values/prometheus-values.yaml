# Values for kube-prometheus-stack (chart 91.9.0)
# Deployed by the `prometheus` Application in namespace `monitoring`.

fullnameOverride: ""

prometheus:
  prometheusSpec:
    retention: 6h
    # Select ServiceMonitors/PrometheusRules from every namespace so the
    # Argo CD monitors (which carry the `release: prometheus` label) are picked
    # up without relying on Helm release label conventions.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

alertmanager:
  enabled: true

# Control-plane component scraping (etcd/scheduler/controller-manager/proxy/
# coredns) deploys Services into kube-system and does not work on a local
# single-node Docker Desktop cluster. Disable it so the AppProject does not
# need access to kube-system.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false

grafana:
  enabled: true
  # The Grafana sidecar loads any ConfigMap labelled `grafana_dashboard`.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# Keep the demo light: we don't need node-level exporters for this brief, but
# leaving them on is harmless. Disable kube-state-metrics churn if desired.
