apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # External URL clients use, served over the tailnet by `tailscale serve`
  # on the desktop (port 443 -> Argo CD NodePort 30443). Must match the GitHub
  # OAuth App homepage and the Dex callback below.
  url: https://bazzite.tailc1546e.ts.net


  # Dex (bundled with Argo CD) is the OIDC issuer for Kargo, and GitHub is the
  # only upstream identity.
  dex.config: |
    # Browsers on the Kargo UI origin (port 8443) fetch Dex discovery and
    # token endpoints on port 443. Dex must allow that origin via CORS.
    allowedOrigins:
      - https://bazzite.tailc1546e.ts.net:8443
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          # Client ID from the GitHub OAuth App. The matching client secret
          # lives out-of-band in the argocd-secret Secret under the key
          # `dex.github.clientSecret` and is referenced here.
          clientID: Ov23liG9JJZkcwACuqg1
          clientSecret: $dex.github.clientSecret
          # Only members of these GitHub orgs may authenticate.
          orgs:
            - name: slip-angle
          # Load team membership as groups (requires org membership).
          loadAllGroups: false
    # OIDC client for Kargo (served by `tailscale serve` on port 8443).
    # Kargo uses PKCE and has no client secret.
    staticClients:
      - id: kargo
        name: Kargo
        public: true
        redirectURIs:
          - https://bazzite.tailc1546e.ts.net:8443/login
