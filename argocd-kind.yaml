kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: akuity-demo

networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 30443
        listenAddress: "127.0.0.1"
      - containerPort: 31443
        hostPort: 31443
        listenAddress: "127.0.0.1"
      - containerPort: 32443
        hostPort: 32443
        listenAddress: "127.0.0.1"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/region=east"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/region=west"
