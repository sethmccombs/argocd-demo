apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kustomize

namespace: east

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: product
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/topology.kubernetes.io~1region
        value: east