apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Multi-source: the Helm chart plus a values-file reference into this repo.
  # The Argo CD monitoring config (ServiceMonitors, dashboards, alerts) lives in
  # the separate `argocd-monitoring` Application so it never waits on Grafana.
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.9.0
      helm:
        valueFiles:
          - $values/argocd/monitoring/values/prometheus-values.yaml
    - repoURL: https://github.com/sethmccombs/argocd-demo.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
