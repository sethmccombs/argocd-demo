apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/sethmccombs/argocd-demo.git
    targetRevision: HEAD
    path: argocd
  syncPolicy:
    # Self-managing: drift in Argo CD's own config is auto-corrected.
    # Prune is intentionally disabled so a bad commit cannot delete Argo CD.
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  # Ignore differences in the argocd-secret's data so the injected Dex client
  # secret and Argo CD's auto-generated admin/redis entries survive each sync.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: argocd-secret
      namespace: argocd
      jsonPointers:
        - /data
