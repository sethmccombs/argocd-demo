apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  # Annotation on this Application: sync-wave 0 (default). The CRDs are in the
  # cert-manager-crds Application at wave -1.
  # cert-manager is a prerequisite for Kargo's webhooks/certificates and is
  # GitOps-managed here so infrastructure is installed the same way as the app.
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    # values defaults - https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml
    # https://artifacthub.io/packages/helm/cert-manager/cert-manager?modal=values-schema
    helm:
      values: |
        # CRDs come from the cert-manager-crds Application (sync-wave -1).
        crds:
          enabled: false
          keep: true
        # Default leader-election roles are created in kube-system; point them at
        # the cert-manager namespace so the AppProject does not need that scope.
        global:
          leaderElection:
            namespace: cert-manager
        crds:
          annotations:
            argocd.argoproj.io/sync-wave: "-1"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true