apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-product-appset
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: application
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # The kargo-product ApplicationSet that creates kargo-product-<stage>.
  source:
    repoURL: https://github.com/sethmccombs/kargo-demo.git
    targetRevision: main
    path: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
